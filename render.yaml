# Configuration Render (https://render.com) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: qui-de-nous
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # URL de connexion Neon (postgresql://…)
        sync: false
      - key: PUSH_CONTACT # ex. mailto:ton.email@exemple.com
        sync: false
      - key: GIPHY_API_KEY # clé gratuite sur developers.giphy.com (ou TENOR_API_KEY à la place)
        sync: false
      - key: OWNER_USERNAME # ton identifiant dans l’app : tu reçois les bugs / avis envoyés par les gens
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT # JSON du compte de service Firebase (notifications de l'app mobile, voir STORE.md)
        sync: false
      - key: CONTACT_EMAIL # adresse de contact des pages confidentialité / conditions
        sync: false
      - key: APP_NAME # nom de l'app sur les stores
        sync: false
