# Builds de l'app mobile dans le cloud (pas besoin du Mac ni d'Android Studio).
# GitHub → Actions → « App mobile » → Run workflow. Secrets à créer : voir STORE.md (section « Cloud builds »).
#  - iOS : compile, signe et envoie sur TestFlight (App Store Connect).
#  - Android : compile et signe le .aab (téléchargeable en bas de la page du build) et, si PLAY_SERVICE_ACCOUNT_JSON
#    existe, l'envoie en brouillon sur la piste de test interne de Google Play.
name: App mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme
        type: choice
        options: [both, ios, android]
        default: both

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON manquant"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Interface + projet natif
        run: node build.js --bump && npx cap sync android
      - name: Clé d'envoi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo "APP_ID=$(node -p "require('./app.config.json').appId")" >> "$GITHUB_ENV"
      - name: Build (.aab signé)
        working-directory: mobile/android
        env:
          RAW_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: |
          # Espaces / retours à la ligne copiés par erreur : enlevés. Autre caractère bizarre (tiret long, guillemet
          # courbe ajoutés par TextEdit…) : message clair au lieu d'une erreur de signature.
          export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d ' \r\n\t')"
          if printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | LC_ALL=C grep -q '[^A-Za-z0-9_-]'; then
            echo "::error::Le secret ANDROID_KEYSTORE_PASSWORD contient un caractère inattendu (tiret long, guillemet…). Recopie-le avec la commande de MAC.md (section 3A)."
            exit 1
          fi
          chmod +x gradlew && ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Envoi sur Google Play (test interne, brouillon)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_ID }}
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Firebase (GoogleService-Info.plist) + clé App Store Connect
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST manquant"; exit 1; fi
          if [ -z "$APPSTORE_API_KEY_P8" ]; then echo "::error::Secret APPSTORE_API_KEY_P8 manquant"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Interface + projet natif
        run: node build.js --bump && npx cap sync ios
      - name: Archive, signature et envoi sur TestFlight
        working-directory: mobile/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" "${AUTH[@]}" archive | tail -n 80
          test "${PIPESTATUS[0]}" -eq 0
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
